<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NetSuite Pro{% endblock %} — Advanced Subnetting Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Animated Background -->
<div class="bg-animated">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
</div>

<!-- Mobile Hamburger -->
<button class="hamburger" id="hamburger" aria-label="Menu">
  <span></span><span></span><span></span>
</button>

<div class="app-layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">🌐</div>
      <div class="logo-text">NetSuite Pro</div>
      <div class="logo-sub">Advanced Network Planner</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-title">Main</div>
      <a href="/" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Dashboard</span>
      </a>

      <div class="nav-section-title">Tools</div>
      <a href="/calculator" class="nav-item">
        <span class="nav-icon">🧮</span>
        <span class="nav-label">Subnet Calculator</span>
      </a>
      <a href="/generator" class="nav-item">
        <span class="nav-icon">⚡</span>
        <span class="nav-label">Subnet Generator</span>
      </a>
      <a href="/vlsm" class="nav-item">
        <span class="nav-icon">🏗️</span>
        <span class="nav-label">VLSM Calculator</span>
      </a>
      <a href="/tools" class="nav-item">
        <span class="nav-icon">🔧</span>
        <span class="nav-label">Network Tools</span>
      </a>

      <div class="nav-section-title">Advanced</div>
      <a href="/simulation" class="nav-item">
        <span class="nav-icon">🎬</span>
        <span class="nav-label">Step Simulation</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle-btn" id="themeToggle">
        <span class="theme-icon">🌙</span>
        <span class="theme-label">Dark Mode</span>
      </button>
    </div>
  </aside>

  <!-- ── Main Content ── -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
